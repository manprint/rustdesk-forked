# All-in-one image (Dockerfile.allinone) in place of hbbs + hbbr + proxy.
services:
  hbbs:
    scale: 0
  hbbr:
    scale: 0
  proxy:
    build:
      context: ../..
      dockerfile: Dockerfile.allinone
    image: rustdesk-allinone:local
    environment:
      RD_DOMAIN: rd.test
      RD_MODE: ssl
      RD_HTTPS_PORT: "443"
      RD_TLS_CERT: /certs/server.crt
      RD_TLS_KEY: /certs/server.key
      MAX_REG_PER_IP: ${RD_MAX_REG_PER_IP:-30}
      MAX_IDS_PER_IP: ${RD_MAX_IDS_PER_IP:-300}
    volumes:
      - data:/data
      - certs:/certs:ro
    read_only: true
    tmpfs:
      - /run:exec,uid=10001,gid=10001,mode=0755
      - /tmp:uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      default:
        aliases: [rd.test]
