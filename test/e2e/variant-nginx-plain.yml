services:
  proxy:
    image: nginx:1.29-alpine
    command: ["/start.sh"]
    # nginx resolves its upstreams at startup and exits if they are not there yet.
    depends_on: [hbbs, hbbr]
    restart: on-failure
    environment:
      RD_SITE: rustdesk-plain.conf
    volumes:
      - ./nginx/start.sh:/start.sh:ro
      - ../../nginx:/prod:ro
  edge:
    image: nginx:1.29-alpine
    depends_on: [proxy]
    restart: on-failure
    environment:
      RD_BACKEND: proxy:80
    volumes:
      - ./edge/nginx-edge.conf:/etc/nginx/templates/default.conf.template:ro
      - certs:/certs:ro
    networks:
      default:
        ipv4_address: 172.31.250.10
        aliases: [rd.test]
