# Minimal httpd.conf for the e2e: everything RustDesk-specific comes from /prod (the files shipped in apache/).
ServerRoot "/usr/local/apache2"
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule headers_module modules/mod_headers.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so
LoadModule remoteip_module modules/mod_remoteip.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule status_module modules/mod_status.so
User www-data
Group www-data
ServerName rd.test
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%a %t \"%r\" %>s %Dus" rd
CustomLog /proc/self/fd/1 rd

Include /prod/rustdesk-mpm.conf

Define RD_DOMAIN     rd.test
Define RD_HBBS       hbbs:21118
Define RD_HBBR       hbbr:21119
Define RD_CONF_DIR   /prod
Define RD_TLS_CERT   /certs/server.crt
Define RD_TLS_KEY    /certs/server.key
Define RD_EDGE_PROXY 172.31.250.10

<IfDefine RD_SSL>
    Listen 443
    SSLSessionCache "shmcb:/usr/local/apache2/logs/ssl_scache(512000)"
    Include /prod/rustdesk-ssl.conf
</IfDefine>
<IfDefine !RD_SSL>
    Listen 80
    Include /prod/rustdesk-plain.conf
</IfDefine>

# Scoreboard for the load test (worker threads held by tunnels).
Listen 8081
<VirtualHost *:8081>
    <Location "/status">
        SetHandler server-status
    </Location>
</VirtualHost>
