# Builds the all-in-one image, smoke-tests it and publishes it on ghcr.io.
#   push on main  -> ghcr.io/<owner>/rustdesk-allinone:main
#   tag vX.Y.Z    -> :X.Y.Z, :X.Y and :latest
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rustdesk-allinone

jobs:
  allinone:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Provenance of the vendored server
        id: prov
        run: |
          . server/UPSTREAM
          {
            echo "server=$(sed -n 's/^version = "\(.*\)"/\1/p' server/Cargo.toml | head -1)"
            echo "upstream=$UPSTREAM_COMMIT"
            echo "fork=$FORK_COMMIT"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=rustdesk-allinone
            org.opencontainers.image.description=RustDesk hbbs + hbbr + nginx in one container, WebSocket only
            rustdesk.server.version=${{ steps.prov.outputs.server }}
            rustdesk.upstream.commit=${{ steps.prov.outputs.upstream }}
            rustdesk.fork.commit=${{ steps.prov.outputs.fork }}

      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.allinone
          platforms: linux/amd64
          load: true
          tags: rustdesk-allinone:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: scripts/smoke-allinone.sh rustdesk-allinone:ci

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every layer comes from the cache of the build above: only tags and labels change.
      - name: Push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.allinone
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
