# RustDesk behind Apache, TLS terminated here (only 443 exposed).
# Modules: ssl proxy proxy_http headers rewrite reqtimeout, MPM event (see rustdesk-mpm.conf).

<VirtualHost *:443>
    ServerName ${RD_DOMAIN}
    # WebSocket upgrade needs HTTP/1.1.
    Protocols http/1.1

    SSLEngine on
    SSLCertificateFile    ${RD_TLS_CERT}
    SSLCertificateKeyFile ${RD_TLS_KEY}
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off
    SSLCompression off

    Header always set Strict-Transport-Security "max-age=31536000"
    RequestReadTimeout handshake=10 header=10-20,MinRate=500 body=10
    LimitRequestBody 1024
    KeepAliveTimeout 15

    Include ${RD_CONF_DIR}/rustdesk-proxy.conf
</VirtualHost>
