# Site values used by the RustDesk vhosts. Load this file before them.
Define RD_DOMAIN     rustdesk.example.com
# WebSocket listeners of hbbs / hbbr (published on loopback by docker-compose.yml).
Define RD_HBBS       127.0.0.1:21118
Define RD_HBBR       127.0.0.1:21119
# Directory holding rustdesk-proxy.conf.
Define RD_CONF_DIR   /etc/apache2/rustdesk
# rustdesk-ssl.conf only.
Define RD_TLS_CERT   /etc/ssl/rustdesk/fullchain.pem
Define RD_TLS_KEY    /etc/ssl/rustdesk/privkey.pem
# rustdesk-plain.conf only: address or CIDR of the edge proxy.
Define RD_EDGE_PROXY 10.0.0.1
