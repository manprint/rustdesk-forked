# MPM event sizing for RustDesk. Every open WebSocket tunnel holds one worker thread:
#   threads needed = registered devices + 2 x concurrent remote sessions + other sites.
# Values below serve about 2000 tunnels (MaxRequestWorkers); to grow raise it together with
# ServerLimit, keeping ServerLimit at twice MaxRequestWorkers / ThreadsPerChild.
# Replaces the distribution's mpm_event.conf (Debian: /etc/apache2/mods-available/).
<IfModule mpm_event_module>
    # Twice the processes MaxRequestWorkers needs: after a graceful reload the old ones
    # stay until their tunnels close, and must not take the slots of the new ones.
    ServerLimit             32
    ThreadLimit            128
    ThreadsPerChild        128
    StartServers             2
    MinSpareThreads         64
    MaxSpareThreads        256
    MaxRequestWorkers     2048
    # Recycling a child would cut every tunnel it holds.
    MaxConnectionsPerChild   0
</IfModule>
