# RustDesk over WebSocket - shared by the 443 and the 80 vhost.
# Modules: proxy proxy_http headers rewrite (Apache >= 2.4.47).
# RD_HBBS / RD_HBBR come from rustdesk-vars.conf.
# /ws/id    -> hbbs: one long-lived, mostly idle connection per device (10 s server heartbeat).
# /ws/relay -> hbbr: every remote session, two connections each, carries the video stream.

ProxyRequests Off
ProxyPreserveHost On
ProxyIOBufferSize 65536

# hbbs/hbbr trust X-Real-IP as-is: always overwrite what the client sent.
RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"

# Anything that is not a WebSocket upgrade on the two RustDesk paths does not exist.
RewriteEngine On
RewriteCond %{REQUEST_URI} !^/ws/(id|relay)$ [OR]
RewriteCond %{HTTP:Upgrade} !=websocket [NC]
RewriteRule ^ - [R=404,L]

# timeout = idle limit of a tunnel. hbbs pings every 10 s and a session is never
# silent that long, so 120 s only reaps dead peers.
ProxyPass "/ws/id"    "http://${RD_HBBS}/" upgrade=websocket disablereuse=on timeout=120 connectiontimeout=5
ProxyPass "/ws/relay" "http://${RD_HBBR}/" upgrade=websocket disablereuse=on timeout=120 connectiontimeout=5
