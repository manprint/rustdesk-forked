# RustDesk behind Apache on plain HTTP (port 80), for use behind an edge proxy that
# terminates TLS. Never expose this port to the internet: it must be reachable only
# by the edge proxy, which has to
#   - forward the Upgrade/Connection headers (WebSocket) with HTTP/1.1,
#   - allow idle tunnels for at least 120 s,
#   - send the client address in X-Forwarded-For.
# Modules: remoteip proxy proxy_http headers rewrite reqtimeout, MPM event.

<VirtualHost *:80>
    ServerName ${RD_DOMAIN}
    Protocols http/1.1

    # Only the edge proxy's X-Forwarded-For is believed.
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy ${RD_EDGE_PROXY}

    RequestReadTimeout header=10-20,MinRate=500 body=10
    LimitRequestBody 1024
    KeepAliveTimeout 15

    Include ${RD_CONF_DIR}/rustdesk-proxy.conf
</VirtualHost>
