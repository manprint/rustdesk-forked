# RustDesk over WebSocket - shared by the 443 and the 80 server blocks.
# /ws/id    -> hbbs: one long-lived, mostly idle connection per device (10 s server heartbeat).
# /ws/relay -> hbbr: every remote session, two connections each, carries the video stream.

proxy_http_version 1.1;
proxy_set_header Host            $host;
proxy_set_header Upgrade         $http_upgrade;
proxy_set_header Connection      "upgrade";
# hbbs/hbbr trust X-Real-IP as-is: always overwrite what the client sent.
proxy_set_header X-Real-IP       $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;

proxy_connect_timeout   5s;
# Idle limit of a tunnel. hbbs pings every 10 s and a session is never silent
# that long, so 120 s only reaps dead peers.
proxy_read_timeout      120s;
proxy_send_timeout      120s;
proxy_buffering         off;
proxy_request_buffering off;
proxy_socket_keepalive  on;
tcp_nodelay             on;

limit_conn rd_conn 512;
limit_req  zone=rd_req burst=1000 nodelay;

location = /ws/id {
    if ($rd_not_websocket) { return 404; }
    proxy_buffer_size 4k;
    proxy_pass http://rustdesk_hbbs/;
}

location = /ws/relay {
    if ($rd_not_websocket) { return 404; }
    # Tunnel buffer, allocated once per direction for every session.
    proxy_buffer_size 64k;
    # Never used (buffering is off), but nginx refuses a proxy_buffer_size above their total.
    proxy_buffers 4 64k;
    proxy_pass http://rustdesk_hbbr/;
}

# Clients configured with an API server poll /api/* every few seconds; the OSS server has none.
location /api/ { access_log off; return 404; }
location /     { return 404; }
