# RustDesk behind nginx on plain HTTP (port 80), for use behind an edge proxy that
# terminates TLS. Never expose this port to the internet: it must be reachable only
# by the edge proxy, which has to
#   - forward the Upgrade/Connection headers (WebSocket) with HTTP/1.1,
#   - allow idle tunnels for at least 120 s,
#   - send the client address in X-Forwarded-For.

server {
    listen 80;
    listen [::]:80;
    server_name rustdesk.example.com;

    # Address (or CIDR) of the edge proxy: only its X-Forwarded-For is believed.
    set_real_ip_from 10.0.0.1;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    server_tokens off;
    client_header_timeout 10s;
    client_max_body_size  1k;
    keepalive_timeout     15s;

    include /etc/nginx/rustdesk-locations.conf;
}
