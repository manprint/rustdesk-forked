# Complete main config for a dedicated nginx (Docker / all-in-one image).
# On an existing nginx keep your own nginx.conf and only take the limits from here.
worker_processes auto;
# Each tunnel uses two descriptors (client + upstream).
worker_rlimit_nofile 65536;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    log_format rustdesk '$remote_addr [$time_iso8601] "$request" $status '
                        'in=$request_length out=$bytes_sent t=$request_time';
    access_log /dev/stdout rustdesk;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;
    sendfile on;
    reset_timedout_connection on;
    include /etc/nginx/conf.d/*.conf;
}
