# RustDesk behind nginx, TLS terminated here (only 443 exposed).
# Install as /etc/nginx/conf.d/rustdesk.conf together with rustdesk-http.conf and
# rustdesk-locations.conf; set server_name, certificate paths and the include path.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rustdesk.example.com;

    ssl_certificate     /etc/ssl/rustdesk/fullchain.pem;
    ssl_certificate_key /etc/ssl/rustdesk/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:rd_tls:10m;
    ssl_session_timeout 1d;
    # Small records: lower latency for the interactive stream.
    ssl_buffer_size     4k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;
    client_header_timeout 10s;
    client_max_body_size  1k;
    keepalive_timeout     15s;

    include /etc/nginx/rustdesk-locations.conf;
}
