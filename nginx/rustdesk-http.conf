# RustDesk over WebSocket - definitions for the http{} context.
# Install as /etc/nginx/conf.d/00-rustdesk-http.conf (must load before the server block).

map $http_upgrade $rd_not_websocket {
    default      1;
    ~*^websocket$ 0;
}

# Only these two addresses need changing if hbbs/hbbr are not on this host.
upstream rustdesk_hbbs { server 127.0.0.1:21118; }
upstream rustdesk_hbbr { server 127.0.0.1:21119; }

# Per client IP. A whole office behind one NAT counts as one IP: keep these generous.
limit_conn_zone $binary_remote_addr zone=rd_conn:10m;
limit_req_zone  $binary_remote_addr zone=rd_req:10m rate=100r/s;
limit_conn_status 429;
limit_req_status  429;
